  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <!-- PWA: Service Worker 登録 + インストール案内ボタン -->
    <button id="pwa-install" hidden style="position:fixed;right:16px;bottom:16px;z-index:60;border:0;border-radius:9999px;padding:12px 18px;font-weight:700;font-size:0.9rem;background:#e8622c;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,0.35);cursor:pointer;font-family:system-ui,sans-serif;">📲 アプリを追加</button>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("/sw.js").catch(function () {});
        });
      }
      (function () {
        var deferred = null;
        var btn = document.getElementById("pwa-install");
        if (localStorage.getItem("pwa-install-hide") === "1") return;
        window.addEventListener("beforeinstallprompt", function (e) {
          e.preventDefault();
          deferred = e;
          if (btn) btn.hidden = false;
        });
        if (btn) {
          btn.addEventListener("click", function () {
            if (!deferred) return;
            deferred.prompt();
            deferred.userChoice.finally(function () {
              deferred = null;
              btn.hidden = true;
              localStorage.setItem("pwa-install-hide", "1");
            });
          });
        }
        window.addEventListener("appinstalled", function () {
          if (btn) btn.hidden = true;
          localStorage.setItem("pwa-install-hide", "1");
        });
      })();
    </script>
  </body>
</html>
